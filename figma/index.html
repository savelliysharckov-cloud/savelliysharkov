<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saveliy Sharkov, Figma boards</title>
<meta name="theme-color" content="#0a0a09">
<link rel="preload" href="/work/fonts/instrument-sans-wght.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Instrument Sans";src:url("/work/fonts/instrument-sans-wght.woff2") format("woff2");font-weight:400 700;font-display:swap}
:root{--ground:#0a0a09;--ink:rgba(236,233,226,.92);--dim:rgba(236,233,226,.5);--line:rgba(236,233,226,.12)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:"Instrument Sans",system-ui,sans-serif;font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
a:hover{color:#fff}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;padding:1.15rem clamp(1rem,3vw,2.2rem) 1rem}
.top .name{letter-spacing:.02em}
.top .what{color:var(--dim)}
main{padding:0 clamp(1rem,3vw,2.2rem) 3rem;display:grid;gap:2.4rem}
.board h2{font-size:15px;font-weight:500;margin:0 0 .6rem;display:flex;justify-content:space-between;align-items:baseline;gap:1rem}
.board h2 a{color:var(--dim);font-weight:400}
.board h2 a:hover{color:#fff}
.frame{position:relative;width:100%;aspect-ratio:16/10;background:#000;border:1px solid var(--line)}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
@media (max-width:700px){.frame{aspect-ratio:4/5}}
</style>
</head>
<body>

<header class="top">
  <a class="name" href="/">Saveliy Sharkov</a>
  <span class="what">Figma boards</span>
</header>

<main>
  <section class="board">
    <h2>Every Human Being <a href="https://www.figma.com/design/F6qLJQZKKg9VhjvakBvSkY/EHB-presentation-update?node-id=0-1&amp;t=pNGnDdsBgkDpm7bC-1" target="_blank" rel="noopener">open in Figma ↗</a></h2>
    <div class="frame">
      <iframe src="https://embed.figma.com/design/F6qLJQZKKg9VhjvakBvSkY/EHB-presentation-update?node-id=0-1&amp;embed-host=share" title="Every Human Being, Figma board" loading="lazy" allowfullscreen></iframe>
    </div>
  </section>

  <section class="board">
    <h2>DUST <a href="https://www.figma.com/design/D9oOUCI8F9jD2rJF2MU7iL/DUST?node-id=0-1&amp;t=olYRWJrWfSNzGAb6-1" target="_blank" rel="noopener">open in Figma ↗</a></h2>
    <div class="frame">
      <iframe src="https://embed.figma.com/design/D9oOUCI8F9jD2rJF2MU7iL/DUST?node-id=0-1&amp;embed-host=share" title="DUST, Figma board" loading="lazy" allowfullscreen></iframe>
    </div>
  </section>
</main>

</body>
</html>
