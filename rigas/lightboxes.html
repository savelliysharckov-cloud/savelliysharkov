<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lightboxes · Rigas Modes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --fg:#ECE5D8; --muted:#9A9184;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;min-height:100%}
/* matches the dark surround of the photos so their edges disappear */
body{background:#130F0B;color:var(--fg);font:400 13px/1.4 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid #FF6A5C;outline-offset:2px}
.top{position:fixed;left:0;right:0;top:0;z-index:2;display:flex;gap:16px;align-items:baseline;justify-content:space-between;
  padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px}
.top a{font-weight:600;text-decoration:none}
.top a:hover{text-decoration:underline}
.top p{margin:0;max-width:44ch;color:var(--muted);text-align:right}
main{min-height:100svh;display:flex;justify-content:center;align-items:center}
figure{position:relative;margin:0;width:min(50vw,80svh);aspect-ratio:4/5}
/* the photo edges dissolve into the page, so stacked photos show no seam */
figure img{display:block;width:100%;height:100%;object-fit:cover;
  -webkit-mask-image:linear-gradient(transparent,#000 9%,#000 91%,transparent),linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent);
  -webkit-mask-composite:source-in;mask-image:linear-gradient(transparent,#000 9%,#000 91%,transparent),linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent);mask-composite:intersect}
figcaption{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--muted);font-size:12px;letter-spacing:.04em}
@media (max-width:700px) and (orientation:portrait){
  main{flex-direction:column;padding-top:56px}
  figure{width:100vw}
  .top{position:absolute}
  .top p{display:none}
}
</style>
</head>
<body>
<header class="top">
  <a href="../rigas_modes_1975-3.html#sheet">← Sheet</a>
  <p>Prints are on both sides, so the light revealed both sides at once.</p>
</header>
<main>
  <figure>
    <img src="img/lightbox-rigas-modes.jpg" width="1600" height="2000" alt="A Rigas Modes pattern sheet on a lightbox, lines of both sides showing through" fetchpriority="high">
    <figcaption>Rigas Modes</figcaption>
  </figure>
  <figure>
    <img src="img/lightbox-zhurnal-mod.jpg" width="1600" height="2000" alt="A Zhurnal Mod pattern sheet on a lightbox, lines of both sides showing through" fetchpriority="high">
    <figcaption>Zhurnal Mod</figcaption>
  </figure>
</main>
</body>
</html>
