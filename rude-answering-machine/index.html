<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rude Answering Machine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#ece8dc;
  --ink:#141311;
  --bg:#050505;
  --line:#ece8dc;
  --clinic:#c7dccd;
  --red:#d4251a;
  --gap:clamp(8px,1.8vh,18px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--paper);font-family:'IBM Plex Mono',ui-monospace,monospace}
body.blink{background:var(--red)}
.app{
  position:relative;z-index:1;height:100vh;height:100dvh;max-width:1280px;margin:0 auto;
  display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);gap:var(--gap);
  padding:clamp(10px,2.2vh,24px) clamp(12px,2.5vw,32px);
}
header{display:flex;justify-content:center;min-width:0;overflow:hidden}
h1{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:clamp(30px,7vh,72px);line-height:.9;text-transform:uppercase;white-space:nowrap;letter-spacing:.02em}

/* stage: 2 refs | photo | 2 refs */
.stage{min-height:0;display:grid;grid-template-columns:1fr auto 1fr;gap:clamp(10px,2.2vw,30px)}
.col{min-height:0;display:flex;flex-direction:column;justify-content:center;gap:clamp(12px,2.4vh,26px)}
.col.l{align-items:flex-end}
.col.r{align-items:flex-start}
.ref{
  flex:0 1 auto;min-height:0;height:calc(50% - 14px);max-width:100%;aspect-ratio:2/3;object-fit:cover;
  border:3px solid var(--line);background:#bbb;filter:contrast(1.05);
}
.col.l .ref:nth-child(1){transform:rotate(-2.5deg)}
.col.l .ref:nth-child(2){transform:rotate(1.5deg)}
.col.r .ref:nth-child(1){transform:scaleX(-1) rotate(-2.5deg)}
.col.r .ref:nth-child(2){transform:scaleX(-1) rotate(1.5deg)}

.panel{
  position:relative;height:100%;aspect-ratio:4/5;max-width:100%;justify-self:center;
  border:3px solid var(--line);background:#1a1918;overflow:hidden;
}
.panel canvas,.panel video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.panel canvas{filter:contrast(1.08) saturate(1.18);opacity:0}
.panel video{transform:scaleX(-1);opacity:0}
body[data-state=camera] .panel video{opacity:1}
body[data-state=face] .panel canvas,body[data-state=answer] .panel canvas{opacity:1}
.ph{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:8px;color:var(--paper);text-align:center}
.ph b{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:clamp(90px,24vh,240px);line-height:.85}
.ph span{font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.75}
body[data-state=camera] .ph,body[data-state=face] .ph,body[data-state=answer] .ph{display:none}
.count{position:absolute;inset:0;display:grid;place-items:center;font-family:Anton,Impact,sans-serif;font-size:clamp(100px,26vh,240px);color:var(--paper);-webkit-text-stroke:4px var(--ink);pointer-events:none}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:flash .55s ease-out}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
.panel.think canvas{animation:think .07s steps(2) infinite}
@keyframes think{0%{transform:translate(-4px,2px) rotate(-.8deg) scale(1.02)}50%{transform:translate(4px,-3px) rotate(.8deg)}100%{transform:translate(-2px,3px)}}

.qtag{position:absolute;top:10px;left:10px;right:10px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;pointer-events:none}
.qtag:not(:empty){}
.qtag span{background:var(--paper);color:var(--ink);padding:3px 6px;box-decoration-break:clone;-webkit-box-decoration-break:clone;line-height:1.7}
.stamp{
  position:absolute;left:5%;right:5%;bottom:5%;
  background:var(--paper);color:var(--ink);text-align:center;text-transform:uppercase;
  font-family:Anton,Impact,sans-serif;font-weight:400;line-height:.95;
  font-size:clamp(26px,5.6vh,60px);padding:.22em .3em .26em;transform:rotate(-2.5deg);
  box-shadow:5px 5px 0 var(--red);
}
.stamp.mid{font-size:clamp(22px,4.4vh,46px)}
.stamp.long{font-size:clamp(18px,3.5vh,36px)}
.stamp.red{background:var(--red);color:var(--paper);box-shadow:5px 5px 0 var(--ink)}
.stamp:empty{display:none}
.stamp.go{animation:stamp .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{0%{transform:scale(1.7) rotate(-9deg);opacity:0}100%{transform:rotate(-2.5deg);opacity:1}}

/* bottom bar */
.bar{min-height:58px;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
.status{font-size:12px;letter-spacing:.1em;text-transform:uppercase;text-align:center}
body[data-state=face] .status,body[data-state=answer] .status{display:none}
.sec{display:none;align-items:center;justify-content:center;gap:14px;width:min(640px,100%)}
body[data-state=intro] .sec[data-show~=intro],
body[data-state=face] .sec[data-show~=face],
body[data-state=answer] .sec[data-show~=answer]{display:flex}
.btn{
  font-family:Anton,Impact,sans-serif;font-size:clamp(20px,3.4vh,30px);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;
  background:var(--paper);color:var(--ink);border:3px solid var(--paper);padding:.3em .8em;cursor:pointer;
  box-shadow:5px 5px 0 var(--red);transition:transform .08s,box-shadow .08s;flex:1;
}
.btn:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--red)}
.btn.ghost{background:transparent;color:var(--paper);box-shadow:5px 5px 0 var(--red)}
.btn.slim{flex:0 0 auto}
.link{background:none;border:0;font:inherit;font-size:12px;text-transform:uppercase;letter-spacing:.1em;text-decoration:underline;cursor:pointer;color:var(--paper);white-space:nowrap}
.q{flex:1;min-width:0;font-family:inherit;font-size:16px;background:transparent;border:0;border-bottom:3px solid var(--paper);padding:10px 2px;color:var(--paper);outline:none}
.q::placeholder{color:#8a867c}

/* portrait screens: refs go in a row above the photo */
@media (max-aspect-ratio:1/1){
  .stage{grid-template-columns:1fr 1fr;grid-template-rows:auto minmax(0,1fr);row-gap:var(--gap)}
  .col{flex-direction:row;align-items:center !important;gap:10px}
  .col.l{justify-content:flex-end}
  .col.r{justify-content:flex-start}
  .ref{height:clamp(70px,15vh,170px);width:auto;flex:0 0 auto;border-width:2px}
  .col.l{grid-row:1;grid-column:1}
  .col.r{grid-row:1;grid-column:2}
  .panel{grid-row:2;grid-column:1/-1}
  h1{font-size:8.4vw}
}

/* OPERA */
.opera{position:fixed;inset:0;z-index:10;background:var(--red);display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden}
.opera[hidden]{display:none}
.opera::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 46px,rgba(20,19,17,.08) 46px 48px)}
.opera .stage2{position:relative;height:min(66vh,110vw);margin-bottom:22vh;aspect-ratio:4/5;animation:vib .18s ease-in-out infinite alternate}
.opera canvas{width:100%;height:100%;border:3px solid var(--ink);filter:contrast(1.1) saturate(1.25);box-shadow:10px 10px 0 var(--ink)}
@keyframes vib{0%{transform:scale(1) rotate(-.5deg)}100%{transform:scale(1.03) rotate(.5deg)}}
.mistake{
  position:absolute;left:50%;bottom:5vh;transform:translateX(-50%) rotate(-5deg);
  font-family:Anton,Impact,sans-serif;font-size:clamp(80px,22vw,260px);line-height:.85;color:var(--red);
  -webkit-text-stroke:3px var(--ink);white-space:nowrap;animation:tremble .09s steps(2) infinite;
}
.opera.clinic{background:var(--clinic)}
.opera:not(.clinic) .mistake{color:var(--paper);-webkit-text-stroke:3px var(--ink)}
.mistake{max-width:none}
.mistake.mid{font-size:min(13vw,17vh);white-space:normal;width:94vw;text-align:center}
.mistake.long{font-size:min(9vw,12vh);white-space:normal;width:94vw;text-align:center}
@keyframes tremble{0%{transform:translateX(-50%) rotate(-5deg)}50%{transform:translateX(-50%) rotate(-4deg) translate(3px,-3px)}100%{transform:translateX(-50%) rotate(-6deg) translate(-3px,2px)}}
.opera .tiny{position:absolute;top:16px;right:16px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink)}
</style>
</head>

cv.width = W; cv.height = H;

operaCv.width = W; operaCv.height = H;

const operaEl = $('#opera'), stampEl = $('#stamp'), qtagEl = $('#qtag');
const outImg = new ImageData(W, H);

const setState = s => document.body.dataset.state = s;
const setStatus = s => statusEl.textContent = s || '';
const sleep = ms => new Promise(r => setTimeout(r, ms));
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const lerp = (a, b, t) => ({ x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t });
const norm = v => { const n = Math.hypot(v.x, v.y) || 1; return { x: v.x / n, y: v.y / n }; };

/* ============ FACE LANDMARKS (MediaPipe) ============ */
let landmarker = null, lmPromise = null;
function loadLandmarker() {
  if (lmPromise) return lmPromise;
  lmPromise = (async () => {
    try {
      const base = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
      const v = await import(base + "/vision_bundle.mjs");
      const fs = await v.FilesetResolver.forVisionTasks(base + "/wasm");
      landmarker = await v.FaceLandmarker.createFromOptions(fs, {
        baseOptions: {
          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
          delegate: "CPU"
        },
        runningMode: "IMAGE", numFaces: 1
      });
    } catch (e) { console.warn('Face model failed, using fallback', e); landmarker = null; }
    return landmarker;
  })();
  return lmPromise;
}

/* ============ UGLIFIER ============ */
// giant eyes, swollen nose, tiny puffy mouth, pinched chin, ears pulled out
function warp(F, t, op) {
  const src = FACE.base, d = outImg.data;
  const B = [];
  for (const e of F.eyes) B.push({ c: e, R: F.eyeW * 1.9, k: 0.68 * t + 0.1 * op });
  B.push({ c: F.nose, R: F.noseW * 1.35, k: 0.5 * t });
  for (const ear of F.ears) B.push({ c: ear.c, R: F.fw * 0.2, k: 0.45 * t });
  B.push({ c: F.chinC, R: F.fw * 0.36, k: -0.45 * t });
  const nb = B.length;
  const { mC, hw, ux, uy, ears, fw } = F;
  const shift = fw * 0.11 * t, eR2 = (fw * 0.22) ** 2;
  const ms = 0.85 * t, mv = 0.5 * t + 0.6 * op;

  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    let dx = 0, dy = 0;
    for (let i = 0; i < nb; i++) {
      const b = B[i], ex = x - b.c.x, ey = y - b.c.y, d2 = ex * ex + ey * ey;
      if (d2 < b.R * b.R && d2 > 1e-4) {
        const f = Math.sqrt(d2) / b.R, m = 1 - b.k * (1 - f) * (1 - f);
        dx += ex * (m - 1); dy += ey * (m - 1);
      }
    }
    const rx = x - mC.x, ry = y - mC.y;
    const u = (rx * ux.x + ry * ux.y) / hw, v = (rx * uy.x + ry * uy.y) / hw;
    if (u > -4.5 && u < 4.5 && v > -3.5 && v < 3.5) {
      const w = Math.exp(-(u * u) / 2.6 - (v * v) / 1.2);
      const u0 = u * (1 + ms * w), v0 = v / (1 + mv * w);
      const du = (u0 - u) * hw, dv = (v0 - v) * hw;
      dx += ux.x * du + uy.x * dv; dy += ux.y * du + uy.y * dv;
    }
    for (let e = 0; e < 2; e++) {
      const ear = ears[e], ex = x - ear.c.x, ey = y - ear.c.y, d2 = ex * ex + ey * ey;
      if (d2 < eR2 * 4) { const w = Math.exp(-d2 / eR2); dx -= ear.dir.x * shift * w; dy -= ear.dir.y * shift * w; }
    }
    const sx = x + dx, sy = y + dy, o = (y * W + x) * 4;
    if (sx < 0 || sy < 0 || sx >= W - 1 || sy >= H - 1) { d[o] = 38; d[o + 1] = 36; d[o + 2] = 33; }
    else {
      const x0 = sx | 0, y0 = sy | 0, fx = sx - x0, fy = sy - y0, i = (y0 * W + x0) * 4, j = i + W * 4;
      const a = (1 - fx) * (1 - fy), b = fx * (1 - fy), c = (1 - fx) * fy, e = fx * fy;
      d[o] = src[i] * a + src[i + 4] * b + src[j] * c + src[j + 4] * e;
      d[o + 1] = src[i + 1] * a + src[i + 5] * b + src[j + 1] * c + src[j + 5] * e;
      d[o + 2] = src[i + 2] * a + src[i + 6] * b + src[j + 2] * c + src[j + 6] * e;
    }
    d[o + 3] = 255;
  }
}
function singingMouth(c2d, F, op) {
  const { mC, hw, ux } = F;
  const rx = hw * 0.45, ry = hw * 0.95 * op;
  c2d.save();
  c2d.translate(mC.x, mC.y); c2d.rotate(Math.atan2(ux.y, ux.x));
  c2d.beginPath(); c2d.ellipse(0, ry * 0.25, rx, ry, 0, 0, Math.PI * 2);
  const g = c2d.createRadialGradient(0, ry * 0.45, 1, 0, ry * 0.25, Math.max(rx, ry));
  g.addColorStop(0, '#050000'); g.addColorStop(1, '#4a1010');
  c2d.fillStyle = g; c2d.fill();
  c2d.save(); c2d.clip(); c2d.fillStyle = '#efe7d6'; c2d.fillRect(-rx, ry * 0.25 - ry, rx * 2, ry * 0.3); c2d.restore();
  c2d.lineWidth = hw * 0.18; c2d.strokeStyle = 'rgba(178,64,70,.95)'; c2d.stroke();
  c2d.restore();
}
function render(t, op, target) {
  warp(FACE.F, t, op);
  target.putImageData(outImg, 0, 0);

}

/* ============ BUILD FACE FROM SNAPSHOT ============ */
function buildFace(src, pts) {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d', { willReadFrequently: true });
  x.fillStyle = '#26241f'; x.fillRect(0, 0, W, H);
  let cx, cy, cw;
  if (pts) {
    let minx = 1e9, maxx = -1e9, miny = 1e9, maxy = -1e9;
    for (const q of pts) { minx = Math.min(minx, q.x); maxx = Math.max(maxx, q.x); miny = Math.min(miny, q.y); maxy = Math.max(maxy, q.y); }
    const fw = maxx - minx, fh = maxy - miny;
    cw = Math.max(fw * 2.0, fh * 1.55); cx = (minx + maxx) / 2; cy = (miny + maxy) / 2 - fh * 0.08;
  } else {
    cw = Math.min(src.width, src.height * 0.8) * 0.9; cx = src.width / 2; cy = src.height / 2;
  }
  cw = Math.min(cw, src.width, src.height * W / H);
  const ch = cw * H / W;
  cx = Math.min(Math.max(cx, cw / 2), src.width - cw / 2);
  cy = Math.min(Math.max(cy, ch / 2), src.height - ch / 2);
  const sx0 = cx - cw / 2, sy0 = cy - ch / 2, s = W / cw;
  x.setTransform(s, 0, 0, s, -sx0 * s, -sy0 * s);
  x.drawImage(src, 0, 0);
  x.setTransform(1, 0, 0, 1, 0, 0);

  let F;
  if (pts) {
    const P = i => ({ x: (pts[i].x - sx0) * s, y: (pts[i].y - sy0) * s });
    const avg = (...ids) => { let ax = 0, ay = 0; ids.forEach(i => { const q = P(i); ax += q.x; ay += q.y; }); return { x: ax / ids.length, y: ay / ids.length }; };
    F = mkFeatures({
      eyeA: pts.length > 473 ? P(468) : avg(33, 133, 159, 145),
      eyeB: pts.length > 473 ? P(473) : avg(362, 263, 386, 374),
      eyeW: (dist(P(33), P(133)) + dist(P(362), P(263))) / 2,
      nose: P(1), noseW: dist(P(129), P(358)),
      mC: avg(13, 14), hw: dist(P(61), P(291)) / 2,
      cheekA: P(234), cheekB: P(454), chin: P(152)
    });
  } else {
    F = mkFeatures({
      eyeA: { x: .37 * W, y: .42 * H }, eyeB: { x: .63 * W, y: .42 * H }, eyeW: .1 * W,
      nose: { x: .5 * W, y: .55 * H }, noseW: .12 * W,
      mC: { x: .5 * W, y: .67 * H }, hw: .09 * W,
      cheekA: { x: .2 * W, y: .5 * H }, cheekB: { x: .8 * W, y: .5 * H }, chin: { x: .5 * W, y: .8 * H }
    });
  }
  return { base: x.getImageData(0, 0, W, H).data, F };
}
function mkFeatures(f) {
  const ux = norm({ x: f.eyeB.x - f.eyeA.x, y: f.eyeB.y - f.eyeA.y });
  let uy = { x: -ux.y, y: ux.x }; if (uy.y < 0) uy = { x: -uy.x, y: -uy.y };
  const fw = dist(f.cheekA, f.cheekB), center = lerp(f.cheekA, f.cheekB, .5);
  const ears = [f.cheekA, f.cheekB].map(ch => {
    const dir = norm({ x: ch.x - center.x, y: ch.y - center.y });
    return { dir, c: { x: ch.x + dir.x * fw * .05, y: ch.y + dir.y * fw * .05 } };
  });
  return {
    eyes: [f.eyeA, f.eyeB], eyeW: f.eyeW, nose: f.nose, noseW: f.noseW,
    mC: f.mC, hw: f.hw, ux, uy, fw, ears, chinC: lerp(f.mC, f.chin, .55)
  };
}

async function processImage(src) {
  setStatus('examining your face…');
  await loadLandmarker();
  let pts = null;
  if (landmarker) {
    try {
      const r = landmarker.detect(src);
      if (r.faceLandmarks && r.faceLandmarks.length) pts = r.faceLandmarks[0].map(q => ({ x: q.x * src.width, y: q.y * src.height }));
    } catch (e) { console.warn(e); }
  }
  FACE = buildFace(src, pts);
  render(0, 0, ctx);
  setState('face');
  morph();
  if (matchMedia('(pointer:fine)').matches) $('#question').focus({ preventScroll: true });
}
function morph() {
  const t0 = performance.now(), dur = 1600;
  const step = now => {
    const t = Math.min(1, (now - t0) / dur);
    const e = t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    render(e, 0, ctx);
    if (t < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/* ============ CAMERA ============ */
async function startCamera() {
  if (starting) return;
  starting = true;
  const my = ++camToken, alive = () => my === camToken;
  clearAnswer();
  setState('boot'); setStatus('allow the camera. it wants to see you.');
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 960 } }, audio: false });
  } catch (e) {
    starting = false; if (alive()) { setState('intro'); setStatus('camera is shy.'); } return;
  }
  if (!alive()) { stopCamera(); return; }
  video.srcObject = stream;
  await video.play().catch(() => {});
  setState('camera'); setStatus('look at yourself. last chance to look normal.');
  await sleep(PREVIEW_SECONDS * 1000);
  if (!alive()) return;
  setStatus('don’t move');
  for (const n of [3, 2, 1]) { countEl.textContent = n; await sleep(800); if (!alive()) { countEl.textContent = ''; return; } }
  countEl.textContent = '';
  flashEl.classList.remove('go'); void flashEl.offsetWidth; flashEl.classList.add('go');
  const c = document.createElement('canvas'); c.width = video.videoWidth; c.height = video.videoHeight;
  const x = c.getContext('2d'); x.translate(c.width, 0); x.scale(-1, 1); x.drawImage(video, 0, 0);
  stopCamera();
  starting = false;
  processImage(c);
}
function cancelCamera() { camToken++; starting = false; countEl.textContent = ''; stopCamera(); }
function stopCamera() { if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } video.srcObject = null; }

$('#file').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  cancelCamera();
  const img = new Image();
  img.onload = () => {
    const sc = Math.min(1, 1600 / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(img.src);
    clearAnswer();
    processImage(c);
  };
  img.src = URL.createObjectURL(f);
  e.target.value = '';
});

/* ============ AUDIO: the opera singer ============ */
let ac = null, mistakeBuf = null;
function unlockAudio() {
  try {
    if (!ac) {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      if (MISTAKE_AUDIO_URL) fetch(MISTAKE_AUDIO_URL).then(r => r.arrayBuffer()).then(b => ac.decodeAudioData(b)).then(b => mistakeBuf = b).catch(() => {});
    }
    if (ac.state === 'suspended') ac.resume();
  } catch (e) { ac = null; }
}
function noiseBuf(sec) {
  const b = ac.createBuffer(1, Math.ceil(ac.sampleRate * sec), ac.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return b;
}
function impulse(sec, decay) {
  const len = Math.ceil(ac.sampleRate * sec), b = ac.createBuffer(2, len, ac.sampleRate);
  for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay); }
  return b;
}
function noiseHit(dest, t, dur, type, freq, q, gain) {
  const s = ac.createBufferSource(); s.buffer = noiseBuf(dur + .05);
  const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const g = ac.createGain();
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain, t + .01);
  g.gain.setValueAtTime(gain, t + dur * .6); g.gain.linearRampToValueAtTime(0, t + dur);
  s.connect(f).connect(g).connect(dest); s.start(t); s.stop(t + dur + .05);
}
function singMistake(delay) {
  if (!ac) return;
  const t0 = ac.currentTime + delay;
  if (mistakeBuf) { const s = ac.createBufferSource(); s.buffer = mistakeBuf; s.connect(ac.destination); s.start(t0); return; }

  const master = ac.createGain(); master.gain.value = .7;
  const comp = ac.createDynamicsCompressor();
  const conv = ac.createConvolver(); conv.buffer = impulse(3, 2.5);
  const wet = ac.createGain(); wet.gain.value = .5;
  master.connect(comp); comp.connect(ac.destination); comp.connect(conv); conv.connect(wet); wet.connect(ac.destination);

  const o1 = ac.createOscillator(), o2 = ac.createOscillator();
  o1.type = o2.type = 'sawtooth'; o2.detune.value = 7;
  const vib = ac.createOscillator(); vib.frequency.value = 5.7;
  const vibG = ac.createGain(); vibG.gain.value = 0;
  vib.connect(vibG); vibG.connect(o1.frequency); vibG.connect(o2.frequency);
  const src = ac.createGain(); src.gain.value = .35; o1.connect(src); o2.connect(src);
  const env = ac.createGain(); env.gain.value = 0; env.connect(master);

  const filt = [[1, 8], [.6, 10], [.3, 12], [.35, 7]].map(([g, q]) => {
    const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = q;
    const gg = ac.createGain(); gg.gain.value = g * 5;
    src.connect(f).connect(gg).connect(env); return f;
  });
  filt[3].frequency.value = 2900;
  const V = { m: [280, 900, 2200], i: [390, 1990, 2550], a: [730, 1090, 2440], e: [480, 1900, 2550] };
  const setV = (v, t, ramp) => V[v].forEach((fr, k) => ramp ? filt[k].frequency.linearRampToValueAtTime(fr, t) : filt[k].frequency.setValueAtTime(fr, t));
  setV('m', t0); setV('m', t0 + .08); setV('i', t0 + .14, true);
  setV('a', t0 + .6); setV('a', t0 + 2.55); setV('e', t0 + 2.95, true);

  const E4 = 329.63, A4 = 440;
  for (const o of [o1, o2]) {
    o.frequency.setValueAtTime(E4, t0); o.frequency.setValueAtTime(E4, t0 + .55);
    o.frequency.linearRampToValueAtTime(A4 * .95, t0 + .62); o.frequency.linearRampToValueAtTime(A4, t0 + .8);
    o.frequency.setValueAtTime(A4, t0 + 2.7); o.frequency.linearRampToValueAtTime(A4 * .94, t0 + 3.1);
  }
  vibG.gain.setValueAtTime(0, t0 + .8); vibG.gain.linearRampToValueAtTime(12, t0 + 1.8);

  const g = env.gain;
  g.setValueAtTime(0, t0); g.linearRampToValueAtTime(.35, t0 + .08); g.linearRampToValueAtTime(.8, t0 + .16);
  g.setValueAtTime(.8, t0 + .36); g.linearRampToValueAtTime(0, t0 + .42);
  g.setValueAtTime(0, t0 + .6); g.linearRampToValueAtTime(.7, t0 + .7); g.linearRampToValueAtTime(1, t0 + 1.8);
  g.setValueAtTime(1, t0 + 2.9); g.linearRampToValueAtTime(0, t0 + 3.05);

  noiseHit(master, t0 + .38, .18, 'highpass', 4500, .7, .25);
  noiseHit(master, t0 + .58, .035, 'bandpass', 3500, 1, .5);
  noiseHit(master, t0 + 3.06, .05, 'bandpass', 1700, 1.5, .5);

  [o1, o2, vib].forEach(o => { o.start(t0); o.stop(t0 + 3.3); });
}

/* ============ ASKING ============ */
function pick() {
  const tot = ANSWERS.reduce((s, a) => s + (a.w || 1), 0);
  let r = Math.random() * tot;
  for (const a of ANSWERS) { r -= (a.w || 1); if (r <= 0) return a; }
  return ANSWERS[0];
}
function clearAnswer() { stampEl.textContent = ''; stampEl.className = 'stamp'; qtagEl.innerHTML = ''; }
function ask() {
  if (busy || !FACE) return;
  busy = true; unlockAudio();
  const q = $('#question').value.trim();
  let a; do { a = pick(); } while (a === lastAnswer);
  lastAnswer = a;
  const delay = .9;
  if (a.opera) singMistake(delay);
  clearAnswer();
  panel.classList.add('think');
  setTimeout(() => {
    panel.classList.remove('think');
    const span = document.createElement('span');
    span.textContent = q ? 'Q: ' + q : 'Q: (you didn’t even ask)';
    qtagEl.appendChild(span);
    stampEl.textContent = a.t;
    stampEl.className = 'stamp go' + (a.t.length > 30 ? ' long' : a.t.length > 16 ? ' mid' : '') + (a.opera ? ' red' : '');
    setState('answer');
    blink();
    if (a.pop) openPop(a);
    busy = false;
  }, delay * 1000);
}
function openPop(a) {
  const txt = $('#popText');
  txt.textContent = a.t;
  txt.className = 'mistake' + (a.t.length > 20 ? ' long' : a.t.length > 9 ? ' mid' : '');
  operaEl.classList.toggle('clinic', !!a.opera);
  operaEl.hidden = false;
  if (!a.opera) { render(1, 0, operaCtx); return; }
  const t0 = performance.now();
  const step = now => {
    const t = Math.min(1, (now - t0) / 350);
    render(1, t, operaCtx);
    if (t < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
operaEl.addEventListener('click', () => operaEl.hidden = true);

$('#startBtn').addEventListener('click', () => { unlockAudio(); startCamera(); });
$('#uploadBtn').addEventListener('click', () => { unlockAudio(); $('#file').click(); });
$('#askBtn').addEventListener('click', ask);
$('#question').addEventListener('keydown', e => { if (e.key === 'Enter') ask(); });
$('#againBtn').addEventListener('click', () => { $('#question').value = ''; clearAnswer(); setState('face'); });

/* ============ RED BLINK ============ */
function blink(flashes = 3) {
  let i = 0;
  const on = () => {
    document.body.classList.add('blink');
    setTimeout(() => {
      document.body.classList.remove('blink');
      if (++i < flashes) setTimeout(on, 90);
    }, 90);
  };
  on();
}

/* ============ GO ============ */
loadLandmarker();
startCamera();
