<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>savel.ai.archive</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: archive board — wordmark + sticky filter rail, masonry wall of frames, full-bleed lightbox sheet */
:root{
  --board:#e2e5dc;      /* archival mount board, faintly green */
  --sheet:#eef0ea;      /* raised surface */
  --ink:#1a1e27;        /* blue-black ink */
  --mute:#5d6458;       /* pencil grey, green bias */
  --rule:#c3c8bb;
  --honey:#b8740f;      /* amber accent */
  --honey-ink:#fff8ec;
  --veil:rgba(14,17,22,.94);
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --board:#121510;--sheet:#1a1e18;--ink:#e4e7dc;--mute:#959c8d;--rule:#2d3329;--honey:#e2a23e;--honey-ink:#1a1206;--veil:rgba(6,8,6,.96);color-scheme:dark}}
:root[data-theme="dark"]{--board:#121510;--sheet:#1a1e18;--ink:#e4e7dc;--mute:#959c8d;--rule:#2d3329;--honey:#e2a23e;--honey-ink:#1a1206;--veil:rgba(6,8,6,.96);color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--board);color:var(--ink);font:15px/1.5 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--board)}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--honey);outline-offset:2px}

.mast{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 32px;padding-block:28px 18px;border-bottom:1px solid var(--rule)}
.mark{font:900 clamp(44px,9vw,112px)/.82 var(--f-display);letter-spacing:-.01em;text-transform:uppercase;margin:0}
.mark span{color:var(--honey)}
.meta{font:12px/1.6 var(--f-mono);color:var(--mute);display:grid;gap:2px;text-align:right}
.meta b{color:var(--ink);font-weight:500}

.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--board);padding-block:12px;border-bottom:1px solid var(--rule);display:grid;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--ink);border-radius:999px;overflow:hidden}
.seg button{border:0;background:none;padding:6px 14px;cursor:pointer;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--board)}
select{background:var(--sheet);border:1px solid var(--rule);border-radius:999px;padding:6px 12px;font-size:13px;max-width:100%}
.count{margin-left:auto;font:12px var(--f-mono);color:var(--mute);font-variant-numeric:tabular-nums}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{border:1px solid var(--rule);background:none;border-radius:999px;padding:3px 10px;font:12px var(--f-mono);cursor:pointer;color:var(--mute)}
.tag:hover{color:var(--ink);border-color:var(--ink)}
.tag[aria-pressed="true"]{background:var(--honey);border-color:var(--honey);color:var(--honey-ink)}
.tag.more{border-style:dashed}
.clear{background:none;border:0;font:12px var(--f-mono);color:var(--honey);cursor:pointer;text-decoration:underline}

.wall{columns:5 240px;column-gap:10px;padding-block:16px 48px}
.tile{break-inside:avoid;margin:0 0 10px;position:relative;display:block;width:100%;border:0;padding:0;background:var(--sheet);cursor:zoom-in;overflow:hidden}
.tile img{display:block;width:100%;height:auto;transition:transform .5s ease,filter .3s}
.tile:hover img{transform:scale(1.025)}
.tile .cap{position:absolute;inset:auto 0 0;padding:22px 10px 8px;background:linear-gradient(transparent,rgba(10,12,9,.82));color:#f1f2ec;text-align:left;opacity:0;transition:opacity .2s;display:grid;gap:1px}
.tile:hover .cap,.tile:focus-visible .cap{opacity:1}
.cap .t{font:600 13px/1.25 var(--f-body)}
.cap .s{font:11px var(--f-mono);opacity:.75}
.no{position:absolute;top:6px;left:6px;font:500 10px var(--f-mono);background:var(--board);color:var(--ink);padding:1px 5px}
.play{position:absolute;top:6px;right:6px;font:500 10px var(--f-mono);background:var(--honey);color:var(--honey-ink);padding:1px 6px}
.empty{padding:60px 0;text-align:center;color:var(--mute)}

.foot{border-top:1px solid var(--rule);padding-block:18px 32px;font:12px var(--f-mono);color:var(--mute);display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}

/* lightbox */
.lb[hidden]{display:none}
.lb{position:fixed;inset:0;z-index:20;background:var(--veil);color:#e8eae2;display:grid;grid-template-columns:minmax(0,1fr) 340px;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.stage{position:relative;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0;padding:24px}
.stage img,.stage video{max-width:100%;max-height:calc(100vh - 48px);object-fit:contain;display:block}
.info{background:#16191400;border-left:1px solid rgba(255,255,255,.12);padding:56px 24px 24px;overflow:auto;display:grid;align-content:start;gap:14px;min-width:0}
.info .no2{font:12px var(--f-mono);color:#e2a23e}
.info h2{font:800 40px/.95 var(--f-display);text-transform:uppercase;margin:0;text-wrap:balance}
.info p{margin:0;color:#c9ccc1;max-width:60ch}
.info dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font:12px var(--f-mono)}
.info dt{color:#8e9586}.info dd{margin:0;min-width:0;overflow-wrap:anywhere}
.info .tags .tag{color:#c9ccc1;border-color:rgba(255,255,255,.25)}
.info .serieslink{background:none;border:0;padding:0;color:#e2a23e;cursor:pointer;font:inherit;text-decoration:underline;text-align:left}
.x,.nav{position:absolute;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.2);color:#fff;cursor:pointer;width:44px;height:44px;border-radius:50%;font-size:20px;line-height:1}
.x{top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));z-index:2}
.nav{top:50%;transform:translateY(-50%)}
.prev{left:12px}.next{right:12px}

@media (max-width:820px){
  .lb{grid-template-columns:1fr;grid-template-rows:minmax(0,62vh) auto;overflow:auto}
  .stage{padding:12px}
  .stage img,.stage video{max-height:calc(62vh - 24px)}
  .info{border-left:0;border-top:1px solid rgba(255,255,255,.12);padding:20px 16px 32px}
  .info h2{font-size:32px}
  .meta{text-align:left}
}
@media (max-width:820px){.rail{position:static}}
@media (max-width:520px){.wall{columns:2 140px;column-gap:6px}.tile{margin-bottom:6px}.count{margin-left:0;width:100%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>

<header class="mast">
  <h1 class="mark">savel<span>.</span>ai<span>.</span>archive</h1>
  <div class="meta">
    <div><b id="m-total">—</b> works · <b id="m-series">—</b> series</div>
    <div id="m-span">—</div>
    <div>Saveliy (Savél) · Barcelona</div>
  </div>
</header>

<nav class="rail" aria-label="Filters">
  <div class="row">
    <div class="seg" role="group" aria-label="Media type">
      <button id="t-all" data-type="" aria-pressed="true">All</button>
      <button id="t-img" data-type="image" aria-pressed="false">Images</button>
      <button id="t-vid" data-type="video" aria-pressed="false">Videos</button>
    </div>
    <div class="seg" role="group" aria-label="Section">
      <button id="g-all" data-group="" aria-pressed="true">Everything</button>
      <button id="g-inv" data-group="Inventions" aria-pressed="false">Inventions</button>
      <button id="g-film" data-group="Films &amp; Worlds" aria-pressed="false">Films &amp; Worlds</button>
    </div>
    <select id="f-series" aria-label="Series"><option value="">All series</option></select>
    <select id="f-sort" aria-label="Sort">
      <option value="new">Newest first</option><option value="old">Oldest first</option><option value="az">A–Z</option>
    </select>
    <span class="count" id="count"></span>
  </div>
  <div class="tags" id="tags"></div>
</nav>

<main class="wall" id="wall" aria-live="polite"></main>
<footer class="foot">
  <span>All images and videos generated with AI tools (Higgsfield, Flux, ChatGPT, Raphael) between 2025 and 2026.</span>
  <span>savelsharkov@gmail.com · @savelliy</span>
</footer>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="Work viewer">
  <div class="stage" id="stage">
    <button class="nav prev" id="prev" aria-label="Previous">‹</button>
    <div id="media"></div>
    <button class="nav next" id="next" aria-label="Next">›</button>
  </div>
  <aside class="info" id="info"></aside>
  <button class="x" id="close" aria-label="Close">✕</button>
</div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let DATA=[],VIEW=[],cur=-1,showAllTags=false;
const st={type:'',group:'',series:'',sort:'new',tags:new Set()};
try{const s=JSON.parse(localStorage.getItem('aiarch')||'{}');if(s.sort)st.sort=s.sort}catch(e){}
const fmtDate=d=>new Date(d+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});

fetch('archive.json').then(r=>r.json()).then(d=>{DATA=d;init()}).catch(()=>{$('#wall').innerHTML='<p class="empty">The archive index could not load. Reload the page.</p>'});

function init(){
  const series=[...new Set(DATA.map(d=>d.series))].sort();
  $('#f-series').insertAdjacentHTML('beforeend',series.map(s=>`<option value="${esc(s)}">${esc(s)} (${DATA.filter(d=>d.series===s).length})</option>`).join(''));
  $('#f-sort').value=st.sort;
  $('#m-total').textContent=DATA.length;$('#m-series').textContent=series.length;
  const ds=DATA.map(d=>d.date).sort();$('#m-span').textContent=fmtDate(ds[0])+' — '+fmtDate(ds[ds.length-1]);
  render();
  const h=location.hash.match(/^#w(\d{3})$/);if(h){const i=VIEW.findIndex(d=>d.id===h[1]);if(i>-1)open(i)}
}
function filtered(){
  let v=DATA.filter(d=>(!st.type||d.type===st.type)&&(!st.group||d.group===st.group)&&(!st.series||d.series===st.series)&&[...st.tags].every(t=>d.tags.includes(t)));
  const by={new:(a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id),old:(a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id),az:(a,b)=>a.title.localeCompare(b.title)||a.id.localeCompare(b.id)};
  return v.sort(by[st.sort]);
}
function renderTags(){
  const pool=DATA.filter(d=>(!st.type||d.type===st.type)&&(!st.group||d.group===st.group)&&(!st.series||d.series===st.series));
  const c={};pool.forEach(d=>d.tags.forEach(t=>c[t]=(c[t]||0)+1));
  let list=Object.entries(c).sort((a,b)=>b[1]-a[1]);
  const LIM=16,more=list.length>LIM;if(!showAllTags)list=list.slice(0,LIM);
  st.tags.forEach(t=>{if(!list.find(x=>x[0]===t))list.unshift([t,c[t]||0])});
  $('#tags').innerHTML=list.map(([t,n])=>`<button class="tag" data-tag="${esc(t)}" aria-pressed="${st.tags.has(t)}">${esc(t)} <span>${n}</span></button>`).join('')
    +(more?`<button class="tag more" id="moretags">${showAllTags?'fewer tags ▴':'more tags ▾'}</button>`:'')
    +(st.tags.size||st.series||st.type||st.group?'<button class="clear" id="clear">clear filters</button>':'');
}
function render(){
  VIEW=filtered();renderTags();
  $('#count').textContent=VIEW.length+' / '+DATA.length;
  $('#wall').innerHTML=VIEW.length?VIEW.map((d,i)=>{
    const img=d.type==='video'?d.poster:d.file;
    const ar=d.w&&d.h?` width="${d.w}" height="${d.h}"`:' width="16" height="9"';
    return `<button class="tile" data-i="${i}" aria-label="${esc(d.title)}, ${esc(d.series)}"><img src="${img}" alt="${esc(d.desc)}" loading="lazy" decoding="async"${ar}><span class="no">${d.id}</span>${d.type==='video'?'<span class="play">▶ video</span>':''}<span class="cap"><span class="t">${esc(d.title)}</span><span class="s">${esc(d.series)} · ${d.date.slice(0,7)}</span></span></button>`}).join('')
    :'<p class="empty">Nothing matches these filters. Clear a tag or pick another series.</p>';
}
function setSeg(attr,val){document.querySelectorAll(`[data-${attr}]`).forEach(b=>b.setAttribute('aria-pressed',b.dataset[attr]===val))}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.type!==undefined&&b.closest('.rail')){st.type=b.dataset.type;setSeg('type',st.type);render()}
  else if(b.dataset.group!==undefined){st.group=b.dataset.group;setSeg('group',st.group);render()}
  else if(b.dataset.tag){const t=b.dataset.tag;if(b.closest('#info')){st.tags=new Set([t]);st.series='';$('#f-series').value='';close();render();scrollTo(0,0);return}st.tags.has(t)?st.tags.delete(t):st.tags.add(t);render()}
  else if(b.id==='moretags'){showAllTags=!showAllTags;renderTags()}
  else if(b.id==='clear'){st.tags.clear();st.series='';st.type='';st.group='';$('#f-series').value='';setSeg('type','');setSeg('group','');render()}
  else if(b.classList.contains('tile'))open(+b.dataset.i);
  else if(b.classList.contains('serieslink')){st.series=b.dataset.series;$('#f-series').value=st.series;st.tags.clear();close();render();scrollTo(0,0)}
});
$('#f-series').onchange=e=>{st.series=e.target.value;render()};
$('#f-sort').onchange=e=>{st.sort=e.target.value;try{localStorage.setItem('aiarch',JSON.stringify({sort:st.sort}))}catch(_){};render()};

function open(i){
  cur=(i+VIEW.length)%VIEW.length;const d=VIEW[cur];
  $('#media').innerHTML=d.type==='video'
    ?`<video src="${d.file}" poster="${d.poster}" controls autoplay muted loop playsinline></video>`
    :`<img src="${d.file}" alt="${esc(d.desc)}">`;
  $('#info').innerHTML=`<div class="no2">Nº ${d.id}</div><h2>${esc(d.title)}</h2><p>${esc(d.desc)}</p>
   <dl><dt>Series</dt><dd><button class="serieslink" data-series="${esc(d.series)}">${esc(d.series)}</button></dd>
   <dt>Date</dt><dd>${fmtDate(d.date)}</dd>
   ${d.model?`<dt>Tool</dt><dd>${esc(d.model)}</dd>`:''}
   <dt>Type</dt><dd>${d.type}${d.w?` · ${d.w}×${d.h} px`:''}</dd>
   ${d.code?`<dt>Job</dt><dd>${esc(d.code)}</dd>`:''}</dl>
   <div class="tags">${d.tags.map(t=>`<button class="tag" data-tag="${esc(t)}">${esc(t)}</button>`).join('')}</div>`;
  const lb=$('#lb');if(lb.hidden){lb.hidden=false;document.body.style.overflow='hidden';$('#close').focus()}
  try{history.replaceState(null,'','#w'+d.id)}catch(_){}
}
function close(){$('#lb').hidden=true;$('#media').innerHTML='';document.body.style.overflow='';try{history.replaceState(null,'',location.pathname+location.search)}catch(_){}}
$('#close').onclick=close;$('#prev').onclick=()=>open(cur-1);$('#next').onclick=()=>open(cur+1);
$('#stage').addEventListener('click',e=>{if(e.target.id==='stage')close()});
document.addEventListener('keydown',e=>{if($('#lb').hidden)return;if(e.key==='Escape')close();if(e.key==='ArrowLeft')open(cur-1);if(e.key==='ArrowRight')open(cur+1)});
let tx=null;$('#stage').addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
$('#stage').addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>50)open(cur+(dx<0?1:-1));tx=null});
</script>

</body>
</html>
